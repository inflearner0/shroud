name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev ninja-build python3
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 18
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang%2Bllvm-18.1.8-x86_64-pc-windows-msvc.tar.xz"
          $archive = "$env:RUNNER_TEMP\llvm.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found on runner" }
          & $sevenZip x $archive "-o$env:RUNNER_TEMP\llvmstage" -y | Out-Null
          $inner = Get-ChildItem "$env:RUNNER_TEMP\llvmstage" -Filter *.tar | Select-Object -First 1
          if (-not $inner) { throw "inner .tar not found in downloaded archive" }
          & $sevenZip x $inner.FullName "-o$env:RUNNER_TEMP\llvmroot" -y | Out-Null
          $root = (Get-ChildItem "$env:RUNNER_TEMP\llvmroot" -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$root\bin\clang.exe")) { throw "clang.exe missing in extracted LLVM tarball" }
          if (-not (Test-Path "$root\lib\cmake\llvm\LLVMConfig.cmake")) { throw "LLVMConfig.cmake missing in extracted LLVM tarball" }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_DIR=$($root.Replace('\','/'))/lib/cmake/llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Provide DIA SDK import library
        shell: pwsh
        run: |
          $destDir = "C:\Program Files (x86)\Microsoft Visual Studio\2019\Professional\DIA SDK\lib\amd64"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $real = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\DIA SDK\lib\amd64\diaguids.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($real) {
            Copy-Item $real.FullName "$destDir\diaguids.lib" -Force
            Write-Output "copied real DIA SDK from $($real.FullName)"
          } else {
            Set-Content "$env:RUNNER_TEMP\dia_stub.c" "int shroud_dia_stub;"
            & "$env:LLVM_ROOT\bin\clang.exe" -c "$env:RUNNER_TEMP\dia_stub.c" -o "$env:RUNNER_TEMP\dia_stub.obj"
            if ($LASTEXITCODE -ne 0) { throw "stub compile failed" }
            & "$env:LLVM_ROOT\bin\llvm-lib.exe" /out:"$destDir\diaguids.lib" "$env:RUNNER_TEMP\dia_stub.obj"
            if ($LASTEXITCODE -ne 0) { throw "llvm-lib failed" }
            Write-Output "created stub diaguids.lib"
          }
      - name: Verify toolchain
        shell: pwsh
        run: |
          clang --version
          where.exe clang
          Get-Item "$env:LLVM_DIR/LLVMConfig.cmake" | Select-Object FullName
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$env:LLVM_DIR"
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build -C Release -R unit --output-on-failure
